<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0b1f3a 0%,#1a3d6e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-card{background:#fff;border-radius:14px;padding:2.5rem;width:100%;max-width:400px;box-shadow:0 25px 60px rgba(0,0,0,.35)}
.login-logo{display:flex;align-items:center;gap:.85rem;margin-bottom:2rem}
.logo-mark{width:48px;height:48px;background:#1d6fa4;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Merriweather',serif;font-size:1.3rem;font-weight:900}
.logo-text{font-family:'Merriweather',serif;font-size:1.1rem;font-weight:900;color:#0b1f3a;line-height:1.25}
.logo-sub{font-size:.7rem;color:#64748b;margin-top:.1rem;display:block}
h1{font-family:'Merriweather',serif;font-size:1.5rem;font-weight:900;color:#0b1f3a;margin-bottom:.4rem}
.subtitle{font-size:.85rem;color:#64748b;margin-bottom:2rem}
.frow{margin-bottom:1.1rem}
.frow label{display:block;font-size:.75rem;font-weight:700;color:#1a202c;margin-bottom:.35rem}
.frow input{width:100%;padding:.7rem .9rem;border:1.5px solid #e2e8f0;border-radius:6px;font-size:.9rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.frow input:focus{border-color:#1d6fa4}
.btn-login{width:100%;background:#1d6fa4;color:#fff;border:none;padding:.9rem;border-radius:6px;font-size:.95rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:background .2s;margin-top:.5rem}
.btn-login:hover{background:#2589c7}
.error-msg{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;padding:.75rem 1rem;border-radius:6px;font-size:.82rem;margin-bottom:1rem}
.back-link{text-align:center;margin-top:1.25rem;font-size:.8rem;color:#64748b}
.back-link a{color:#1d6fa4;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="logo-mark">A</div>
    <div class="logo-text">Admin Panel<span class="logo-sub">School Website Manager</span></div>
  </div>
  <h1>Welcome Back</h1>
  <p class="subtitle">Sign in to manage your school website</p>
  {% if messages %}{% for m in messages %}<div class="error-msg">❌ {{ m }}</div>{% endfor %}{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="frow"><label>Username</label><input type="text" name="username" required autofocus placeholder="Enter username"></div>
    <div class="frow"><label>Password</label><input type="password" name="password" required placeholder="Enter password"></div>
    <button type="submit" class="btn-login">Sign In →</button>
  </form>
  <div class="back-link"><a href="/">← Back to Website</a></div>
</div>
</body>
</html>
